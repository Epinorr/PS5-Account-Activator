name: Build PS5 ELF

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash clang-18 lld-18 make unzip wget

      - name: Install PS5 Payload SDK v0.42
        env:
          SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
        run: |
          wget -q --show-progress "$SDK_URL" -O /tmp/ps5-payload-sdk.zip
          sudo rm -rf /opt/ps5-payload-sdk
          sudo mkdir -p /opt/ps5-payload-sdk
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt/ps5-payload-sdk
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          test -x /opt/ps5-payload-sdk/bin/prospero-strip

      - name: Verify SDK stubs
        run: |
          test -e /opt/ps5-payload-sdk/target/lib/libSceRegMgr.so
          test -e /opt/ps5-payload-sdk/target/lib/libSceUserService.so
          test -e /opt/ps5-payload-sdk/target/lib/libkernel_sys.so

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make clean
          make all

      - name: Validate ELF
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          test -s account_activator.elf
          file account_activator.elf
          /opt/ps5-payload-sdk/bin/llvm-readelf -h account_activator.elf
          /opt/ps5-payload-sdk/bin/llvm-readelf -d account_activator.elf
          /opt/ps5-payload-sdk/bin/llvm-readelf -s account_activator.elf | grep -E 'sceUserService|sceRegMgr|sceKernelSendNotificationRequest'

      - name: Package release asset
        run: |
          mkdir -p dist
          cp account_activator.elf dist/EPINOR-Account-Activator.elf
          sha256sum dist/EPINOR-Account-Activator.elf | tee dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPINOR-Account-Activator
          path: dist/*
          if-no-files-found: error
