name: Build PS5 Account Activator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            make \
            clang-18 \
            lld-18

      - name: Download PS5 Payload SDK
        env:
          SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
        run: |
          wget -q --show-progress "$SDK_URL" -O /tmp/ps5-payload-sdk.zip

          sudo rm -rf /opt/ps5-payload-sdk
          sudo mkdir -p /opt/ps5-payload-sdk
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt/ps5-payload-sdk

          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Configure PS5 SDK
        run: |
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Show SDK installation
        run: |
          echo "SDK: $PS5_PAYLOAD_SDK"
          test -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk"
          ls -la "$PS5_PAYLOAD_SDK/toolchain"

      - name: Build
        run: |
          make clean
          make

      - name: Verify ELF
        run: |
          test -f EPINOR-Account-Activator.elf
          file EPINOR-Account-Activator.elf
          ls -lh EPINOR-Account-Activator.elf

      - name: Generate SHA256
        run: |
          sha256sum EPINOR-Account-Activator.elf > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPINOR-Account-Activator
          path: |
            EPINOR-Account-Activator.elf
            SHA256SUMS.txt
