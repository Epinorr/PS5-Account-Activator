name: Release PS5 Account Activator

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld python3 wget unzip

      - name: Clone PS5 Payload SDK
        run: |
          git clone --depth 1 --branch v0.42 \
            https://github.com/ps5-payload-dev/sdk.git \
            /tmp/ps5-payload-sdk

      - name: Install PS5 Payload SDK
        run: |
          make -C /tmp/ps5-payload-sdk \
            DESTDIR="$HOME/.local/ps5-payload-sdk" \
            clean install

      - name: Build ELF
        env:
          PS5_PAYLOAD_SDK: ${{ runner.home }}/.local/ps5-payload-sdk
        run: |
          make clean
          make all
          test -s account_activator.elf

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp account_activator.elf dist/EPINOR-Account-Activator.elf
          sha256sum dist/EPINOR-Account-Activator.elf > dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EPINOR-Account-Activator.elf
            dist/SHA256SUMS.txt
