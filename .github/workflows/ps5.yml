name: PS5 Account Activator

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ELF
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK v0.42
        uses: actions/checkout@v5
        with:
          repository: ps5-payload-dev/sdk
          ref: v0.42
          path: sdk

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Install PS5 Payload SDK
        working-directory: sdk
        run: |
          set -euxo pipefail
          make DESTDIR="${{ runner.temp }}/ps5-payload-sdk" clean install
          test -f "${{ runner.temp }}/ps5-payload-sdk/toolchain/prospero.mk"
          test -x "${{ runner.temp }}/ps5-payload-sdk/bin/prospero-clang"
          test -x "${{ runner.temp }}/ps5-payload-sdk/bin/prospero-strip"

      - name: Checkout payload
        uses: actions/checkout@v5

      - name: Build payload
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/ps5-payload-sdk
        run: |
          set -euxo pipefail
          make clean all

      - name: Verify ELF
        run: |
          set -euxo pipefail
          test -s EPINOR-Account-Activator.elf
          file EPINOR-Account-Activator.elf
          readelf -h EPINOR-Account-Activator.elf

      - name: Generate checksum
        run: sha256sum EPINOR-Account-Activator.elf > SHA256SUMS.txt

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPINOR-Account-Activator
          if-no-files-found: error
          path: |
            EPINOR-Account-Activator.elf
            SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: EPINOR-Account-Activator
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/EPINOR-Account-Activator.elf
            dist/SHA256SUMS.txt
